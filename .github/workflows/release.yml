name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_code=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if git ls-remote --exit-code origin "refs/tags/v${version_name}" >/dev/null 2>&1; then
            echo "Tag v${version_name} already exists."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version_name}" >/dev/null 2>&1; then
            echo "Release v${version_name} already exists."
            exit 1
          fi

          latest_manifest_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '.assets[] | select(.name == "update.json") | .browser_download_url' 2>/dev/null || true)
          if [[ -n "$latest_manifest_url" ]]; then
            latest_code=$(curl --fail --silent --show-error --location "$latest_manifest_url" | jq -r '.versionCode')
            if (( version_code <= latest_code )); then
              echo "VERSION_CODE must be greater than latest published version (${latest_code})."
              exit 1
            fi
          fi

      - name: Check whitespace
        run: git diff --check HEAD^

      - name: Run full Android verification
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:lintDebug :app:assembleDebug

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/librepipe-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore_path" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare release assets
        run: |
          set -euo pipefail
          version_code=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          apk_name="librepipe-${version_name}.apk"
          mkdir -p dist
          install -m 0644 app/build/outputs/apk/release/app-release.apk "dist/$apk_name"
          apk_sha=$(sha256sum "dist/$apk_name" | awk '{print $1}')
          printf '%s  %s\n' "$apk_sha" "$apk_name" > "dist/${apk_name}.sha256"
          jq -n \
            --argjson versionCode "$version_code" \
            --arg versionName "$version_name" \
            --arg apkAsset "$apk_name" \
            --arg sha256 "$apk_sha" \
            '{schema: 1, versionCode: $versionCode, versionName: $versionName, apkAsset: $apkAsset, sha256: $sha256, minimumSdk: 26}' \
            > dist/update.json

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          tag="v${version_name}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "LibrePipe ${version_name}"
          git push origin "$tag"
          gh release create "$tag" \
            --draft \
            --generate-notes \
            --verify-tag \
            --title "LibrePipe ${version_name}" \
            dist/*.apk \
            dist/*.sha256 \
            dist/update.json
          gh release edit "$tag" --draft=false --latest

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-failure-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
