name: PR verify

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate release version
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_code=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
          version_name=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [[ "$BASE_BRANCH" == "main" ]]; then
            base_code=$(git show "origin/$BASE_BRANCH:gradle.properties" | sed -n 's/^VERSION_CODE=//p')
            base_name=$(git show "origin/$BASE_BRANCH:gradle.properties" | sed -n 's/^VERSION_NAME=//p')
            if (( version_code <= base_code )); then
              echo "VERSION_CODE must increase for every main pull request."
              exit 1
            fi
            if [[ "$version_name" == "$base_name" ]]; then
              echo "VERSION_NAME must change for every main pull request."
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version_name}" >/dev/null 2>&1; then
              echo "Release v${version_name} already exists."
              exit 1
            fi
          fi

      - name: Check whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Run full Android verification
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:lintDebug :app:assembleDebug

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.event.pull_request.number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

